  hero__image: # You can add hero image. For example '/images/06.jpg'


#-------------------------------
# Author Global Settings
author:
  author__name: Sergii Demianchuk
  author__bio: Sergii Demianchuk is a Senior Software Engineering Technical Leader in the S&TO organization at Cisco, where he drives innovation in application security and vulnerability management. With 16 years of specialized experience in AppSec, Sergii has made significant contributions to SBOM security analysis and vulnerability management frameworks. He actively shapes industry standards as a member of both the OASIS OpenEoX Technical Committee and OASIS CSAF Technical Committee. His active participation in the CVE community reflects his commitment to advancing cybersecurity intelligence and standardization across the industry.
  author__avatar: /images/01-1.jpg


